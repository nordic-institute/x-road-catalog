spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ''
    username: xroad_catalog_collector
    password: ''
  jpa:
    database: POSTGRESQL
    generate-ddl: false
    open-in-view: false
    show-sql: false
    hibernate.ddl-auto: none
    properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    user: xroad_catalog
    password: ''
    show-summary: verbose
    contexts: users
    parameters:
      users:
        collector:
          username: xroad_catalog_collector
          password: ''
        lister:
          username: xroad_catalog_lister
          password: ''
  main:
    allow-bean-definition-overriding: true
    web-application-type: none

# X-Road instance parameters
xroad-catalog:
  target:
    xroad-instance: ''
    subsystem-code: ''
    member-class: ''
    member-code: ''
  ssl-keystore:
    location: /etc/xroad/xroad-catalog/keystore
    password: changeit
  urls:
    security-server-host: ''
    list-clients-host: ${xroad-catalog.urls.security-server-host}
    webservices-endpoint: ${xroad-catalog.urls.security-server-host}
  pool-size:
    fetch-openapi: 10
    fetch-rest: 10
    fetch-wsdl: 10
    list-methods: 50
  log-storage:
    error-log-length-in-days: 90
    flush-log-time-after-hour: 3
    flush-log-time-before-hour: 4
  tasks:
    collector-interval-min: 20
    fetch-run-unlimited: false
    fetch-time-after-hour: 3
    fetch-time-before-hour: 4
  # Country specific settings
  country:
    fi:
      # if enabled, URLs must be provided in order for Finland specific services and tasks to be executed properly
      # if disabled, all other fi-specific properties can be removed from profile
      enabled: false
      fetch:
        companies:
          pool-size: 10
          url: ''
        organizations:
          pool-size: 10
          url: ''
        external-limit: 500
        external-update-after-days: 7
        external-interval-min: 20
        external-run-unlimited: false
        external-time-after-hour: 3
        external-time-before-hour: 4
