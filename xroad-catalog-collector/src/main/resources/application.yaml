spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    # Include the driver's socketTimeout (in seconds) so a stalled connection cannot block a fetch
    # worker forever, e.g. jdbc:postgresql://host:port/xroad_catalog?socketTimeout=60
    url: ''
    username: xroad_catalog_collector
    password: ''
  jpa:
    database: POSTGRESQL
    generate-ddl: false
    open-in-view: false
    show-sql: false
    hibernate.ddl-auto: none
    properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    user: xroad_catalog
    password: ''
    show-summary: verbose
    contexts: users
    parameters:
      users:
        collector:
          username: xroad_catalog_collector
          password: ''
        lister:
          username: xroad_catalog_lister
          password: ''
  main:
    web-application-type: servlet
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: -1
  shutdown: graceful

management:
  server:
    port: 8090
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # show-details/show-components are left at their default (never): probes only need the HTTP status code
      cache:
        time-to-live: 10s
      group:
        readiness:
          include: readinessState,db

# X-Road instance parameters
xroad-catalog:
  target:
    xroad-instance: ''
    subsystem-code: ''
    member-class: ''
    member-code: ''
  urls:
    security-server-host: ''
    list-clients-host: ${xroad-catalog.urls.security-server-host}
    webservices-endpoint: ${xroad-catalog.urls.security-server-host}
  pool-size:
    fetch-openapi: 10
    fetch-rest: 10
    fetch-wsdl: 10
    list-methods: 50
  log-storage:
    error-log-length-in-days: 90
    flush-log-time-after-hour: 3
    flush-log-time-before-hour: 4
  tasks:
    collector-interval-min: 20
    fetch-run-unlimited: false
    fetch-time-after-hour: 3
    fetch-time-before-hour: 4
    client-connect-timeout-seconds: 10
    client-read-timeout-seconds: 60
