spring:
  datasource:
    driverClassName: org.h2.Driver
    password: sa
    url: jdbc:h2:mem:db;NON_KEYWORDS=TYPE,VALUE
    username: sa
  h2:
    console:
      enabled: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  liquibase:
    enabled: false
  main:
    web-application-type: servlet
  sql:
    init:
      mode: always
      platform: h2

# X-Road instance parameters
xroad-catalog:
  target:
    xroad-instance: ''
    subsystem-code: ''
    member-class: ''
    member-code: ''
  ssl-keystore:
    location: /etc/xroad/xroad-catalog/keystore
    password: changeit
  urls:
    security-server-host: ''
    list-clients-host: ${xroad-catalog.urls.security-server-host}
    webservices-endpoint: ${xroad-catalog.urls.security-server-host}
  pool-size:
    fetch-openapi: 10
    fetch-rest: 10
    fetch-wsdl: 10
    list-methods: 50
  log-storage:
    error-log-length-in-days: 90
    flush-log-time-after-hour: 3
    flush-log-time-before-hour: 4
  tasks:
    collector-interval-min: 20
    fetch-run-unlimited: false
    fetch-time-after-hour: 3
    fetch-time-before-hour: 4


  # Country specific settings
  country:
    fi:
      enabled: true
      fetch:
        companies:
          pool-size: 1
          url: https://avoindata.prh.fi/bis/v1
        organizations:
          pool-size: 1
          url: https://api.palvelutietovaranto.suomi.fi/api/v11/Organization
        external-limit: 500
        external-update-after-days: 7
        external-interval-min: 20
        external-run-unlimited: false
        external-time-after-hour: 3
        external-time-before-hour: 4

# Increasing logging levels in tests for better debugging
logging:
  level:
    javax.ws.rs: TRACE
    org.apache.http: DEBUG
    org.hibernate: ERROR
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.jdbc.extract: TRACE
    org.hibernate.type: TRACE
    org.springframework.beans.factory.support.DefaultListableBeanFactory: DEBUG
    org.springframework.security: TRACE
    org.springframework.web: TRACE
    org.springframework.web.server.adapter.HttpWebHandlerAdapter: DEBUG
    org.springframework.ws: TRACE
