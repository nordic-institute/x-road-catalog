# Testcontainers docker-java client configuration
# This file pins the Docker API version to work around version compatibility issues.
# The vendored docker-java client defaults to API version 1.32, which modern Docker
# daemons reject as below their supported minimum (e.g., Docker Desktop 29.6.1+ requires
# at least 1.40). Pinning 1.41 (Docker Engine 20.10+, released 2020) ensures tests work
# on modern daemons while remaining compatible with reasonably recent Docker installations.
# This configuration applies to test classpaths only (testFixtures resource).
api.version=1.41
