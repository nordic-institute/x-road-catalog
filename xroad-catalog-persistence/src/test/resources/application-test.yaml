spring:
  h2.console.enabled: false
  liquibase:
    enabled: false
  sql.init:
    mode: always
    platform: h2
  datasource:
    url: jdbc:h2:mem:db;NON_KEYWORDS=TYPE,VALUE
    driverClassName: org.h2.Driver
    username: sa
    password: sa
  jpa:
    defer-datasource-initialization: true
    show-sql: true
    hibernate.ddl-auto: create-drop
    properties:
      hibernate.generate_statistics: true


