spring:
  h2.console.enabled: 'false'
  sql.init:
    mode: always
    platform: h2
  datasource:
    url: jdbc:h2:mem:db;NON_KEYWORDS=TYPE,VALUE
    driverClassName: org.h2.Driver
    username: sa
    password: sa
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: 'true'
    hibernate:
      ddl-auto: create-drop
    show-sql: 'true'

xroad-catalog:
  country:
    fi:
      enabled: 'true'
