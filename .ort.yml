  rule_violations:
    - message: "free-restricted license LicenseRef-scancode-ecma-documentation in Maven:org.apache.cxf:.*"
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "The specification files meant by this license hit are not modified and thus are used in accordance with the license."
    - message: "proprietary-free license LicenseRef-scancode-efsl-1.0 in Maven:jakarta.*"
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "The specification files meant by this license hit are not modified and thus are used in accordance with the license."
    - message: "The declared license 'The BSD License' could not be mapped to a valid license or parsed as an SPDX expression. The license was found in package Maven:org.codehaus.woodstox:stax2-api:4.2.1."
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "The declared license is not conflicting, and the actual license has been checked from the package."
    - message: "proprietary-free license LicenseRef-scancode-sun-prop-non-commercial in Maven:com.sun.xml.bind:jaxb-xjc:2.1.7."
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "The finding is to a file which is found in later files with CDDL-1.0 OR GPL-2.0-only WITH Classpath-exception-2.0, of which CDDL-1.0 is chosen. While web hits can no longer confirm this for this exact version, earlier analysis did confirm this with web hits."
    - message: "property:non-commercial license LicenseRef-scancode-sun-prop-non-commercial in Maven:com.sun.xml.bind:jaxb-xjc:2.1.7."
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "The finding is to a file which is found in later files with CDDL-1.0 OR GPL-2.0-only WITH Classpath-exception-2.0, of which CDDL-1.0 is chosen. While web hits can no longer confirm this for this exact version, earlier analysis did confirm this with web hits."
    - message: "commercial license LicenseRef-scancode-proprietary-license in Maven:javax.xml.bind:jaxb-api:2.1."
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "The finding is to a file which is found in later files with CDDL-1.1 OR GPL-2.0-only WITH Classpath-exception-2.0, of which CDDL-1.1 is chosen. While web hits can no longer confirm this for this exact version, earlier analysis did confirm this with web hits. The latest version contains many of the same files with BSD-3-Clause."
    - message: "Strong copyleft in open source project code CC-BY-SA-3.0 in Gradle::x-road-catalog:.*"
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "The files meant by this license hit are not distributed with X-Road Catalog."
    - message: "copyleft-strong license GPL-3.0-only in Maven:gradle.plugin.com.hierynomus.gradle.plugins:license-gradle-plugin:.*"
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "The files meant by this license hit are related to a Gradle plugin and are not distributed with X-Road Catalog."
    - message: "copyleft-strong license GPL-3.0-or-later in Maven:gradle.plugin.com.hierynomus.gradle.plugins:license-gradle-plugin:.*"
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "The files meant by this license hit are related to a Gradle plugin and are not distributed with X-Road Catalog."
    - message: "copyleft-strong license GPL-2.0-only in Maven:gradle.plugin.com.hierynomus.gradle.plugins:license-gradle-plugin:.*"
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "The files meant by this license hit are related to a Gradle plugin and are not distributed with X-Road Catalog."
    - message: "copyleft-strong license GPL-2.0-or-later in Maven:gradle.plugin.com.hierynomus.gradle.plugins:license-gradle-plugin:.*"
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "The files meant by this license hit are related to a Gradle plugin and are not distributed with X-Road Catalog."
    - message: "copyleft-strong license GPL-2.0-or-later in Maven:org.jetbrains.kotlin:kotlin-compiler-embeddable:.*"
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "The files meant by this license hit are not distributed with X-Road Catalog."
    - message: "copyleft-strong license GPL-1.0-or-later in Maven:org.jetbrains.kotlin:kotlin-compiler-embeddable:.*"
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "The files meant by this license hit are not distributed with X-Road Catalog."
    - message: "source-available license FSL-1.1-ALv2 in Maven:org.liquibase:liquibase-core:.*"
      reason: "LICENSE_ACQUIRED_EXCEPTION"
      comment: "Liquibase relicensed at 5.0 from Apache-2.0 to FSL-1.1-ALv2 (Functional Source
        License 1.1, Apache-2.0 Future License). NIIS accepts the FSL terms for this dependency.
        FSL is source-available, not OSI-approved open source: it permits use, modification and
        redistribution but prohibits use to provide a competing product or service, and each
        release converts to Apache-2.0 two years after publication. X-Road Catalog embeds Liquibase 
        for database migrations and does not compete with it, so the non-compete condition is satisfied."
  issues:
    - message: "(?s)IOException: Could not resolve provenance for package 'Maven:org.niis.xroad:configuration-client:.*"
      reason: "CANT_FIX_ISSUE"
      comment: "org.niis.xroad:configuration-client is published as a shaded executable
          uber-jar, not a library. Its manifest declares Main-Class
          org.niis.xroad.confclient.application.ConfClientDaemonMain, and the 7.8.3 artifact
          holds 32161 entries in 114 MB, of which only 406 are org/niis classes; the rest is
          BouncyCastle, Jackson, Logback and other dependencies flattened in by the shadow
          build. No -sources.jar is published (HTTP 404), and both the pom and the Gradle
          module metadata declare zero dependencies, so the scanner has neither an ARTIFACT
          nor a VCS origin to resolve. This cannot be fixed from X-Road Catalog.

          The bundled third-party code is not unreviewed: it is analysed in the X-Road
          repository's own Double Open Compliance runs, which resolve the full dependency
          tree. The gap here is one of attribution location, not of missing review.

          A packages curation pointing vcs at src/service/configuration-client in the X-Road
          repository was considered and rejected: it would scan only the 1.3% of the artifact
          that is NIIS-authored source and report the package as scanned, understating the
          licences actually shipped. Recording the gap is preferred to closing it falsely.

          The durable fix is to depend on a thin library module rather than the uber-jar, so
          that its dependencies resolve in this project's own graph. Revisit this resolution
          if that change is made, or if configuration-client is ever published as a
          non-shaded artifact."
