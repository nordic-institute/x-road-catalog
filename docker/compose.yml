name: xrd-catalog-service-dev

services:
  xrd-catalog-db:
    image: postgres:16-alpine
    ports:
      - 4910:5432
    environment:
      POSTGRES_DB: xroad_catalog
      POSTGRES_USER: xroad_catalog
      POSTGRES_PASSWORD: secret
    volumes:
      - xrd-catalog-db-data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
      - ./db/init-app-roles.sql:/docker-entrypoint-initdb.d/init-app-roles.sql:ro
    networks:
      - xrd-catalog-network
  adminer:
    image: adminer
    volumes:
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 5080:8080
    depends_on:
      - xrd-catalog-db
    networks:
      - xrd-catalog-network
  xrd-catalog-collector:
    build:
      context: ../.
      dockerfile: docker/collector/Dockerfile
    # Must stay above the application-side shutdown budget, otherwise Docker SIGKILLs mid-shutdown. Raise this
    # if spring.lifecycle.timeout-per-shutdown-phase or DefaultTasksInitializer.SHUTDOWN_GRACE_SECONDS is raised.
    stop_grace_period: 35s
    environment:
      # spring
      - setting_spring.datasource.url=jdbc:postgresql://xrd-catalog-db:5432/xroad_catalog?socketTimeout=60
      - setting_spring.datasource.password=xroad_catalog_collector
      - setting_spring.liquibase.password=secret
      - setting_spring.liquibase.contexts=users
      # catalog
      - setting_xroad-catalog.target.xroad-instance=DEV
      - setting_xroad-catalog.target.subsystem-code=catalog
      - setting_xroad-catalog.target.member-class=COM
      - setting_xroad-catalog.target.member-code=1234
      - setting_xroad-catalog.instance.ignored-subsystem-ids[0]=DEV:COM:1234:MANAGEMENT
      - setting_xroad-catalog.urls.security-server-host=http://ss0:8080/
      - setting_xroad-catalog.urls.list-clients-host=http://ss0:8080/
      - setting_xroad-catalog.urls.webservices-endpoint=http://ss0:8080/
      - setting_xroad-catalog.pool-size.fetch-openapi=5
      - setting_xroad-catalog.pool-size.fetch-rest=5
      - setting_xroad-catalog.pool-size.fetch-wsdl=5
      - setting_xroad-catalog.pool-size.list-methods=5
      - setting_xroad-catalog.log-storage.error-log-length-in-days=90
      - setting_xroad-catalog.log-storage.flush-log-time-after-hour=3
      - setting_xroad-catalog.log-storage.flush-log-time-before-hour=4
      - setting_xroad-catalog.tasks.collector-interval-min=1
      - setting_xroad-catalog.tasks.fetch-run-unlimited=true
      - setting_xroad-catalog.tasks.fetch-time-after-hour=3
      - setting_xroad-catalog.tasks.fetch-time-before-hour=4
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - xrd-catalog-db
    networks:
      - xrd-catalog-network
      - xroad-network
  xrd-catalog-lister:
    build:
      context: ../.
      dockerfile: docker/lister/Dockerfile
    # Must stay above the application-side shutdown budget (spring.lifecycle.timeout-per-shutdown-phase, 30s),
    # otherwise Docker SIGKILLs mid-shutdown. If that timeout is raised, raise this too.
    stop_grace_period: 35s
    environment:
      # spring
      - setting_spring.profiles.active=dev
      - setting_spring.datasource.url=jdbc:postgresql://xrd-catalog-db:5432/xroad_catalog
      - setting_spring.datasource.password=xroad_catalog_lister
      # xroad
      - setting_xroad.common.configuration-path=/etc/xroad/globalconf
      - setting_xroad.proxy.configuration-anchor-file=/etc/xroad/configuration-anchor.xml
      - setting_xroad.configuration-client.port=5665
      - setting_xroad.configuration-client.admin-port=5675
      - setting_xroad.configuration-client.update-interval=60
      - setting_xroad.configuration-client.allowed-federations=none
      - setting_xroad.configuration-client.proxy-configuration-backup-cron=0 15 3 * * ?
      - setting_xroad.configuration-client.global_conf_tls_cert_verification=false
      - setting_xroad.configuration-client.global_conf_hostname_verification=false
      # catalog
      - setting_xroad-catalog.shared-params-file=/etc/xroad/globalconf/DEV/shared-params.xml
      - setting_xroad-catalog.configuration-client.enabled=true
      - setting_xroad-catalog.legacy-api.enabled=true
    volumes:
      - ./lister/config/configuration-anchor.xml:/etc/xroad/configuration-anchor.xml:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 8070:8080
    depends_on:
      - xrd-catalog-collector
    networks:
      - xrd-catalog-network
      - xroad-network

volumes:
  xrd-catalog-db-data:
networks:
  xrd-catalog-network:
    name: xrd-catalog-network
    driver: bridge
  xroad-network:
    external: true
