spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ''
    username: xroad_catalog_lister
    password: ''
  jpa:
    database: POSTGRESQL
    generate-ddl: false
    open-in-view: false
    show-sql: false
    hibernate.ddl-auto: none
    properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

# OpenAPI documentation
springdoc:
  packagesToScan: org.niis.xroad,fi.dvv.xroad
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /api-docs

# X-Road configuration-client parameters
xroad:
  conf:
    path: /etc/xroad/

# X-Road instance parameters
xroad-catalog:
  shared-params-file: ${xroad.conf.path}globalconf/<INSTANCE_IDENTIFIER>/shared-params.xml
  country:
    fi:
      enabled: false
  configuration-client:
    enabled: true

logging:
  level:
    org:
      hibernate: ERROR
      springframework:
        web: DEBUG
        ws: DEBUG
