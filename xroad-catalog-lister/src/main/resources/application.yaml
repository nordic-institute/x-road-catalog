spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    password: ''
    url: ''
    username: xroad_catalog_lister
  jpa:
    database: POSTGRESQL
    generate-ddl: false
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  liquibase:
    enabled: false
  sql:
    init:
      platform: postgres

# OpenAPI documentation
springdoc:
  api-docs:
    enabled: true
  packagesToScan: org.niis.xroad,fi.dvv.xroad
  swagger-ui:
    enabled: true
    path: /api-docs

# X-Road instance parameters
xroad-catalog:
  shared-params-file: /etc/xroad/globalconf/<INSTANCE_IDENTIFIER>/shared-params.xml
  country:
    fi:
      enabled: false

logging:
  level:
    org:
      hibernate: ERROR
      springframework:
        web: DEBUG
        ws: DEBUG
