# production PostgreSQL settings
spring.jpa.database=POSTGRESQL
spring.sql.init.platform=postgres
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.generate-ddl=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.datasource.driver-class-name=org.postgresql.Driver
#spring.datasource.url=jdbc:postgresql://localhost:5432/xroad_catalog
spring.datasource.url=jdbc:postgresql://localhost:4910/xroad_catalog
spring.datasource.username=xroad_catalog_lister
spring.datasource.password=xroad_catalog_lister
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true
spring.liquibase.show-summary=verbose
spring.liquibase.contexts=users
spring.liquibase.user=xroad_catalog
spring.liquibase.password=secret
spring.liquibase.parameters.users.lister.username=${spring.datasource.username}
spring.liquibase.parameters.users.lister.password=${spring.datasource.password}