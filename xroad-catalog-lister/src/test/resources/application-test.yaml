spring:
  datasource:
    driverClassName: org.h2.Driver
    password: sa
    url: jdbc:h2:mem:db;NON_KEYWORDS=TYPE,VALUE
    username: sa
  h2.console.enabled: false
  liquibase:
    enabled: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
    show-sql: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate.generate_statistics: true
  main.allow-bean-definition-overriding: true
  sql:
    init:
      mode: always
      platform: h2

# OpenAPI documentation
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# X-Road instance parameters
xroad-catalog:
  shared-params-file: src/test/resources/shared-params.xml
  configuration-client.enabled: false

# Increasing logging levels in tests for better debugging
logging:
  level:
    javax.ws.rs: TRACE
    org.apache.http: DEBUG
    org.hibernate: ERROR
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.jdbc.extract: TRACE
    org.hibernate.type: TRACE
    org.springframework.beans.factory.support.DefaultListableBeanFactory: DEBUG
    org.springframework.security: TRACE
    org.springframework.web: TRACE
    org.springframework.web.server.adapter.HttpWebHandlerAdapter: DEBUG
    org.springframework.ws: TRACE
