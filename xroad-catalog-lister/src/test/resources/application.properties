
xroad-catalog.shared-params-file=src/test/resources/shared-params.xml

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

spring.liquibase.enabled=false
spring.jpa.show-sql=false
spring.h2.console.enabled=false
spring.sql.init.platform=h2
spring.sql.init.mode=always
spring.datasource.url=jdbc:h2:mem:db;NON_KEYWORDS=TYPE,VALUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=create-drop

# Increasing logging levels in tests for better debugging
logging.level.javax.ws.rs=TRACE
logging.level.org.apache.http=DEBUG
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.orm.jdbc.extract=TRACE
logging.level.org.hibernate.type=TRACE
logging.level.org.springframework.beans.factory.support.DefaultListableBeanFactory=DEBUG
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=TRACE
logging.level.org.springframework.web.server.adapter.HttpWebHandlerAdapter=DEBUG
logging.level.org.springframework.ws=TRACE
