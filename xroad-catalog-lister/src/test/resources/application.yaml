logging:
  level:
    org:
      apache:
        http: DEBUG
      hibernate:
        orm:
          jdbc:
            bind: TRACE
            extract: TRACE
        nodeValue: ERROR
        type: TRACE
      springframework:
        security: TRACE
        web:
          server:
            adapter:
              HttpWebHandlerAdapter: DEBUG
          nodeValue: TRACE
        ws: TRACE
        beans:
          factory:
            support:
              DefaultListableBeanFactory: DEBUG
    javax:
      ws:
        rs: TRACE
spring:
  datasource:
    driverClassName: org.h2.Driver
    password: sa
    username: sa
    url: jdbc:h2:mem:db;NON_KEYWORDS=TYPE,VALUE
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: 'true'
    show-sql: 'false'
  sql:
    init:
      mode: always
      platform: h2
  h2:
    console:
      enabled: 'false'
  liquibase:
    enabled: 'false'
springdoc:
  swagger-ui:
    enabled: 'false'
  api-docs:
    enabled: 'false'
xroad-catalog:
  shared-params-file: src/test/resources/shared-params.xml
